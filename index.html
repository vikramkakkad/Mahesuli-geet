<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>મહેસૂલી આંદોલન ગીત પ્લેલિસ્ટ</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .player {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: #222;
      border-radius: 15px;
    }

    audio {
      display: block;
      width: 100%;
      margin: 18px 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #0f6c42;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #148653;
    }

    .playlist {
      max-height: 300px;
      overflow-y: auto;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 10px;
      text-align: left;
    }

    .song {
      display: block;
      width: 100%;
      margin: 0;
      padding: 12px;
      border-bottom: 1px solid #333;
      border-radius: 5px;
      background: transparent;
      text-align: left;
    }

    .song.active {
      background: #0f6c42;
    }

    #status {
      min-height: 24px;
      color: #ffd166;
    }
  </style>
</head>

<body>
  <h2>🎵 મહેસૂલી આંદોલન — ગીત પ્લેલિસ્ટ</h2>

  <main class="player">
    <h3 id="now">ગીત પસંદ કરો</h3>

    <audio id="audio" controls preload="metadata"></audio>

    <div class="controls">
      <button type="button" id="prevButton">⏮ પાછળ</button>
      <button type="button" id="nextButton">આગળ ⏭</button>
      <button type="button" id="loopButton">🔁 પ્લેલિસ્ટ લૂપ: ચાલુ</button>
    </div>

    <p id="status" aria-live="polite"></p>
    <div class="playlist" id="playlist"></div>
  </main>

  <script>
    // ફાઇલના નામ GitHub પર દેખાય છે એ જ રીતે લખો.
    const songs = [
      { title: "ગીત 1", file: "Geet1.mp3" },
      { title: "ગીત 2", file: "Geet2.mp3" },
      { title: "ગીત 3", file: "Geet3.mp3" },
      { title: "ગીત 4", file: "Geet4.mp3" },
      { title: "ગીત 5", file: "Geet5.mp3" }
    ];

    let currentIndex = 0;
    let loopPlaylist = true;

    const audio = document.getElementById("audio");
    const now = document.getElementById("now");
    const playlist = document.getElementById("playlist");
    const status = document.getElementById("status");
    const loopButton = document.getElementById("loopButton");

    function showPlaylist() {
      songs.forEach((song, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "song";
        button.textContent = `${index + 1}. ${song.title}`;
        button.addEventListener("click", () => playSong(index));
        playlist.appendChild(button);
      });

      updateActiveSong();
    }

    function updateActiveSong() {
      const buttons = playlist.querySelectorAll(".song");

      buttons.forEach((button, index) => {
        button.classList.toggle("active", index === currentIndex);
      });
    }

    async function playSong(index) {
      if (songs.length === 0) {
        now.textContent = "પ્લેલિસ્ટમાં ગીત નથી";
        return;
      }

      currentIndex = (index + songs.length) % songs.length;

      const song = songs[currentIndex];
      audio.src = song.file;
      now.textContent = `🎶 ${song.title}`;
      status.textContent = "";
      updateActiveSong();

      try {
        await audio.play();
      } catch {
        status.textContent =
          "Play દબાવો. ગીત ન વાગે તો ફાઇલનું નામ અને અક્ષરો તપાસો.";
      }
    }

    document.getElementById("prevButton").addEventListener("click", () => {
      playSong(currentIndex - 1);
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      playSong(currentIndex + 1);
    });

    loopButton.addEventListener("click", () => {
      loopPlaylist = !loopPlaylist;
      loopButton.textContent =
        `🔁 પ્લેલિસ્ટ લૂપ: ${loopPlaylist ? "ચાલુ" : "બંધ"}`;
    });

    audio.addEventListener("ended", () => {
      if (currentIndex < songs.length - 1) {
        playSong(currentIndex + 1);
      } else if (loopPlaylist) {
        playSong(0);
      }
    });

    audio.addEventListener("error", () => {
      status.textContent =
        "ગીત લોડ થયું નથી. GitHub પરનું ફાઇલનામ અને તેનો uppercase/lowercase મેળવો.";
    });

    showPlaylist();

    if (songs.length > 0) {
      audio.src = songs[0].file;
      now.textContent = `🎵 ${songs[0].title} — Play દબાવો`;
    }
  </script>
</body>
</html>
